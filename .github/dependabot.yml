version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      bun-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      bun-major:
        patterns:
          - '*'
        update-types:
          - major
    labels:
      - dependencies
      - frontend

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      cargo-major:
        patterns:
          - '*'
        update-types:
          - major
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - ci
